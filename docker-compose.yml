name: sportmatch

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sportmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sportmatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  back:
    build:
      context: ./back
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "3001:3001"
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: postgresql://root:root@db:5432/sportmatch?schema=public
      FRONT_URL: http://localhost:3000
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
